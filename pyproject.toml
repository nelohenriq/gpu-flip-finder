[project]
name = "gpu-flip-finder"
version = "0.1.0"
description = "AI-powered GPU flipping deal discovery"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[dependency-groups]
dev = ["pytest", "ruff"]
main = [
    "scrapling[ai]>=0.5.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.0",
    "python-telegram-bot>=20.7",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "tenacity>=8.2.3",
]

[project.scripts]
gpu-flip-finder = "app:run"
